[project]
name = "poe2-control-center"
version = "0.1.0"
description = "Локальный анализ персонажей Path of Exile 2 на движке Path of Building 2"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = [
    "integration: тест запускает реальный pob-mcp и PoB2 (медленно, нужна локальная установка)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
